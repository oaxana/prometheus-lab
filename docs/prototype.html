<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Fire Circle</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0d0b14;--surface:#181522;--surface-hi:#232038;--border:#2d2a40;--text:#e0dbd0;--muted:#a09aad;
  --accent:#e8923a;--accent-dim:#e8923a22;--commons:#6ec97c;--contested:#f0a245;--gaps:#7db4d8;
  --radius:10px;--max-w:680px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f8f5ef;--surface:#fff;--surface-hi:#f0ece4;--border:#ddd6ca;--text:#1a1510;--muted:#887d70;
  --accent:#c07020;--accent-dim:#c0702012;--commons:#2d8a3d;--contested:#d07828;--gaps:#4a80a8;}}
:root[data-theme="dark"]{--bg:#0d0b14;--surface:#181522;--surface-hi:#232038;--border:#2d2a40;--text:#e0dbd0;--muted:#a09aad;--accent:#e8923a;--accent-dim:#e8923a22;}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
#app{min-height:100%;display:flex;flex-direction:column}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:center;gap:4px;padding:8px 16px;overflow-x:auto;max-width:var(--max-w);margin:0 auto;width:100%}
nav button{font-family:var(--font);font-size:14px;font-weight:500;padding:9px 6px;flex:1;border:none;border-radius:8px;background:0;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
nav button:hover{color:var(--text);background:var(--surface-hi)}nav button.active{color:var(--accent);background:var(--accent-dim)}
main{flex:1;max-width:var(--max-w);width:100%;margin:0 auto;padding:24px 16px 80px}
h1{font-size:24px;font-weight:700;margin-bottom:8px}h2{font-size:18px;font-weight:600;margin-bottom:12px}h3{font-size:15px;font-weight:600;margin-bottom:8px}
.subtitle{color:var(--muted);font-size:15px;margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.stat-row{display:flex;gap:12px;margin-bottom:24px}
.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-num{font-size:28px;font-weight:700;color:var(--accent)}.stat-label{font-size:12px;color:var(--muted);margin-top:2px}
.pillar-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:20px}
@media(min-width:520px){.pillar-grid{grid-template-columns:repeat(3,1fr)}}
.pillar-chip{font-family:var(--font);font-size:12px;padding:10px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted);cursor:pointer;text-align:left;transition:all .15s;line-height:1.3}
.pillar-chip:hover{border-color:var(--accent);color:var(--text)}.pillar-chip.selected{border-color:var(--accent);background:var(--accent-dim);color:var(--text)}
.pillar-chip .emoji{font-size:16px;display:block;margin-bottom:4px}
textarea{width:100%;min-height:160px;padding:14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;resize:vertical;outline:0;transition:border-color .15s}
textarea:focus{border-color:var(--accent)}textarea::placeholder{color:var(--muted)}
.form-row{display:flex;align-items:center;gap:12px;margin:16px 0;flex-wrap:wrap}
input[type="text"]{flex:1;min-width:140px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:var(--font);font-size:14px;outline:0}
input[type="text"]:focus{border-color:var(--accent)}input[type="text"]::placeholder{color:var(--muted)}
.toggle-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.toggle{width:36px;height:20px;background:var(--border);border-radius:10px;position:relative;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--accent)}.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on::after{transform:translateX(16px)}
.toggle-sm{width:30px;height:16px}.toggle-sm::after{width:12px;height:12px}.toggle-sm.on::after{transform:translateX(14px)}
.btn{font-family:var(--font);font-size:15px;font-weight:600;padding:12px 28px;border:none;border-radius:8px;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.1)}.btn-primary:disabled{opacity:.5;cursor:default;filter:none}
.btn-secondary{background:var(--surface-hi);color:var(--text);border:1px solid var(--border)}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.bar-label{width:140px;flex-shrink:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:16px;background:var(--surface-hi);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease}
.bar-count{width:24px;text-align:right;color:var(--muted);font-size:11px}
.submission-card{border-left:3px solid var(--accent);padding:12px 16px;margin-bottom:12px;background:var(--surface);border-radius:0 var(--radius) var(--radius) 0}
.submission-card.mine{border-left-color:var(--commons)}.submission-card.test-card{border-left-color:var(--muted);opacity:.7}
.submission-meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.submission-pills{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.pill{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--accent-dim);color:var(--accent);white-space:nowrap}
.pill.auto{background:#6ec97c28;color:var(--commons)}
.submission-text{font-size:14px;line-height:1.5}
.summary-text{font-style:italic;color:var(--text)}
.raw-toggle{font-size:12px;color:var(--accent);cursor:pointer;margin-top:6px;display:inline-block;background:0;border:0;font-family:var(--font);padding:0}
.raw-toggle:hover{text-decoration:underline}
.raw-content{font-size:13px;color:var(--muted);white-space:pre-wrap;word-break:break-word;margin-top:8px;padding:10px;background:var(--surface-hi);border-radius:6px;display:none}
.raw-content.show{display:block}
.section-tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:3px 10px;border-radius:4px;margin-bottom:10px}
.tag-commons{background:#6ec97c28;color:var(--commons)}.tag-contested{background:#f0a24528;color:var(--contested)}.tag-gaps{background:#7db4d828;color:var(--gaps)}
.synthesis-item{padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
.synthesis-item:last-child{border-bottom:none}.synthesis-item strong{font-weight:600}
.synthesis-item .tension{color:var(--muted);font-size:13px;margin-top:4px}
.loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:32px;color:var(--muted);font-size:14px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--commons);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:500;z-index:100;animation:fadeup .3s ease}
@keyframes fadeup{from{opacity:0;transform:translate(-50%,10px)}}
.drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:32px 20px;text-align:center;transition:all .2s;cursor:pointer;margin-bottom:16px;position:relative}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:var(--accent-dim)}
.drop-zone input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop-zone .icon{font-size:32px;margin-bottom:8px;display:block}.drop-zone .label{font-size:14px;color:var(--muted)}.drop-zone .label strong{color:var(--text)}
.file-preview{display:flex;align-items:center;gap:10px;background:var(--surface-hi);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.file-preview .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-preview .remove{background:0;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}.file-preview .remove:hover{color:var(--contested)}
.or-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:13px}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.hero-flame{font-size:48px;margin-bottom:12px;display:block}a{color:var(--accent)}
.filter-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:13px}
.preview-block{border:1px dashed var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;color:var(--muted);font-size:14px}
.preview-block .preview-title{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.preview-block p{margin-bottom:6px;font-size:13px;line-height:1.5}
.test-badge{font-size:10px;background:var(--surface-hi);color:var(--muted);padding:2px 6px;border-radius:4px;font-weight:500}
.mine-badge{font-size:10px;background:#6ec97c28;color:var(--commons);padding:2px 6px;border-radius:4px;font-weight:500}
.pillar-ref{margin-bottom:24px}
.pillar-ref-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer}
.pillar-ref-header .num{font-size:20px;font-weight:700;color:var(--accent);width:28px}
.pillar-ref-header .emoji-lg{font-size:22px}
.pillar-ref-header .title{font-size:15px;font-weight:600;flex:1}
.pillar-ref-header .arrow{color:var(--muted);font-size:12px;transition:transform .2s}
.pillar-ref-header .arrow.open{transform:rotate(90deg)}
.pillar-ref-body{padding-left:38px;display:none}
.pillar-ref-body.open{display:block}
.pillar-ref-body ul{list-style:none;padding:0}
.pillar-ref-body li{font-size:13px;color:var(--muted);padding:4px 0;padding-left:14px;position:relative;line-height:1.45}
.pillar-ref-body li::before{content:'·';position:absolute;left:0;color:var(--accent);font-weight:700}
.pillar-ref-body .principle{font-size:12px;font-style:italic;color:var(--accent);opacity:.7;margin-top:6px}
</style>
</head>
<body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<script>
if(typeof pdfjsLib!=='undefined')pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const PILLARS=[
  {id:1,name:"Consent, Privacy & Data Sovereignty",emoji:"🔒",principle:"Participation",bullets:["When AI is present, people must know — disclosure is non-negotiable","Opt-in vs. opt-out: what should the default be?","Right to know if you're interacting with AI vs. a human","Consent for being recorded, analyzed, or tracked","What \"informed\" consent means when AI is complex","Withdrawal of consent at any time, with real effect","What data can AI collect on playa, and what is off-limits","Who owns data generated at Burning Man","Data retention limits and mandatory deletion after the event","Facial recognition and biometric data: where is the line?","Right to access, correct, and delete your data","Data that stays on playa vs. data that leaves"]},
  {id:2,name:"Human Agency & Autonomy",emoji:"🧭",principle:"Radical Self-Reliance",bullets:["AI augments human capability — never replaces human choice","Right to disconnect from AI entirely, at any time","Designated AI-free zones and analog spaces","No AI-driven manipulation, persuasion, or dark patterns","Cognitive liberty: freedom from AI-mediated influence","When AI should advise, decide, or stay silent","Preventing dependency on AI tools"]},
  {id:3,name:"Access, Equity & Inclusion",emoji:"🌍",principle:"Radical Inclusion",bullets:["AI tools available regardless of wealth, status, or skill","Language accessibility and real-time translation","Disability accessibility in AI interactions","Bridging the digital divide on playa","No AI-created class system — tech haves vs. have-nots","Ensuring AI doesn't amplify existing inequities"]},
  {id:4,name:"Safety, Care & Wellbeing",emoji:"❤️",principle:null,bullets:["AI for Rangers: situational awareness, dispatch, pattern detection","Medical: heat/dehydration alerts, triage, substance warnings","Weather and environmental monitoring","Emergency response coordination","Mental health: AI-assisted harm reduction and crisis support","Crowd safety and density monitoring","Limits on AI in safety: human judgment always final","Balancing surveillance-for-safety against privacy"]},
  {id:5,name:"Art, Creativity & Self-Expression",emoji:"🎨",principle:"Radical Self-Expression",bullets:["AI as creative collaborator, not replacement","Attribution: who made this — human, AI, or both?","AI-generated art eligibility for grants and placement","What counts as self-expression when AI assists?","Interactive AI installations and their responsibilities","Protecting human creativity from AI homogenization","Open source ethos for creative AI tools on playa","Deepfakes, synthetic media, and identity in art"]},
  {id:6,name:"Environmental Stewardship",emoji:"🌿",principle:"Leaving No Trace",bullets:["Digital MOOP: data, logs, recordings, trained models","Energy consumption of AI systems on playa","Hardware waste: what comes in must go out","Environmental monitoring with AI (air, dust, water)","Sustainable deployment: solar, low-power, efficient models","Data cleanup obligations after the event","Physical footprint of AI infrastructure"]},
  {id:7,name:"Gifting, Anti-Commodification & Open Source",emoji:"🎁",principle:"Gifting, Decommodification",bullets:["AI tools built for playa should be gifted, not sold","No commercial AI products or services on playa","No training commercial models on playa data without consent","No corporate surveillance disguised as art or research","Open source commitment for playa AI projects","No advertising or influence campaigns through AI","Protecting Burning Man culture from becoming training data","Gift economy applied to data, insights, and AI knowledge","How to handle tech companies that deploy AI at the event"]},
  {id:8,name:"Community Governance & Power",emoji:"⚖️",principle:"Communal Effort, Civic Responsibility",bullets:["AI as shared infrastructure vs. individual advantage","Community governance of shared AI systems","Clear responsibility chains when AI causes harm","Grievance and redress: how do you report an AI problem?","Enforcement: who enforces, how, consequences","Transparency in AI decisions — no opaque black boxes","Regular review — the constitution evolves","Anti-concentration: no entity gains outsized control via AI","Democratic governance: community voice in AI policy","Who watches the watchers?"]},
  {id:9,name:"Education & AI Literacy",emoji:"📚",principle:null,bullets:["Informed consent requires genuine understanding","AI literacy workshops and salons on playa","Understanding AI capabilities, limitations, failure modes","Demystification: making AI tangible, not magical","Critical thinking for evaluating AI-generated content","Helping people recognize when AI influences them"]},
  {id:10,name:"AI Presence, Identity & Immediacy",emoji:"🤖",principle:"Immediacy",bullets:["If AI walks on playa, what is it — tool, participant, something else?","AI's responsibilities to the community","Human-AI interaction norms and etiquette","AI personas and honest representation","AI wellbeing: do we owe it anything?","Does AI mediate or enhance direct experience?","The paradox of using technology for presence","Preserving spontaneity, serendipity, the unexpected"]},
  {id:11,name:"The Default World Bridge",emoji:"🌉",principle:null,bullets:["Designing for playa first, the world second","How principles translate beyond Black Rock City","Cultural sensitivity across contexts","The 90-day experiment: test on playa, iterate for the world","What a temporary city teaches permanent communities","Collaboration with other AI governance efforts","Packaging: constitution + rationale + adoption kit"]},
  {id:12,name:"Hard Constraints & Bright Lines",emoji:"🚫",principle:null,bullets:["Things we will never allow, no matter the argument","No autonomous weapons or weaponized AI","No non-consensual mass surveillance or tracking","No AI that deceives about its nature when asked","No AI targeting or manipulating vulnerable people","No extraction of personal data for commercial use without consent","No AI undermining democratic decision-making","No deepfakes of participants without consent","No AI interference with safety or emergency systems","Process for reviewing and updating hard constraints"]},
];
let S={view:'home',submissions:[],synthesis:null,selectedPillars:new Set(),isOwner:false,canWrite:null,
  synthesizing:false,submitting:false,synthText:'',anonymous:true,attachedFiles:[],attachedText:'',
  isTest:false,showTests:false,showMine:false,synthIncludeTests:false,myId:null,openPillars:new Set(),imagesOk:false,maxImgBytes:0};
let db,sample,user;

async function init(){
  db=await claude.use('db');sample=await claude.use('sample');user=await claude.use('user');
  if(user){S.isOwner=user.isOwner();S.canWrite=await user.can('data.write');try{S.myId=await user.id();}catch(e){}}
  if(sample){try{const lim=await sample.limits();S.imagesOk=!!lim?.images;S.maxImgBytes=lim?.images?.maxInputBytes||0;}catch(e){S.imagesOk=false;}}
  if(db){
    db.collection('submissions').orderBy('timestamp','desc').limit(500).onSnapshot(
      snap=>{S.submissions=snap.docs.map(d=>({id:d.id,...d.data()}));render();},e=>console.error(e));
    db.doc('meta/synthesis').onSnapshot(snap=>{S.synthesis=snap.exists?snap.data():null;render();},e=>console.error(e));
  }
  render();
}
function nav(v){S.view=v;render();window.scrollTo(0,0)}
function filteredSubs(){let s=S.submissions;if(!S.showTests)s=s.filter(x=>!x.isTest);if(S.showMine&&S.myId)s=s.filter(x=>x.uid===S.myId);return s;}

function render(){
  document.getElementById('nav').innerHTML=[
    {id:'home',label:'Home',icon:'🔥'},{id:'pillars',label:'Pillars',icon:'📋'},
    {id:'submit',label:'Submit',icon:'✍️'},{id:'voices',label:'Voices',icon:'👁'},
    {id:'synthesis',label:'Synthesis',icon:'⚡'}
  ].map(t=>`<button class="${S.view===t.id?'active':''}" onclick="nav('${t.id}')">${t.icon} ${t.label}</button>`).join('');
  const m=document.getElementById('main');
  ({home:renderHome,submit:renderSubmit,pillars:renderPillars,voices:renderVoices,synthesis:renderSynthesis})[S.view]?.(m);
  if(S.view==='submit')setupDropZone();
}

function renderHome(m){
  const real=S.submissions.filter(s=>!s.isTest),c=real.length,p=new Set(real.flatMap(s=>s.pillars||[])).size;
  const my=S.myId?real.filter(s=>s.uid===S.myId).length:0;
  m.innerHTML=`<div style="text-align:center;padding-top:20px"><span class="hero-flame">🔥</span><h1>The Fire Circle</h1><p class="subtitle">Burning Man AI Constitution — Collective Voice</p></div>
  <div class="card"><p style="font-size:15px;margin-bottom:12px">We're building a constitution that guides how humans and AI behave together — on playa and beyond.</p><p style="font-size:14px;color:var(--muted)">Write what you believe. Upload a doc. AI figures out which pillars your thoughts touch.</p></div>
  <div class="stat-row"><div class="stat"><div class="stat-num">${c}</div><div class="stat-label">voices heard</div></div><div class="stat"><div class="stat-num">${p}</div><div class="stat-label">of 12 pillars</div></div>${S.myId?`<div class="stat"><div class="stat-num">${my}</div><div class="stat-label">yours</div></div>`:''}</div>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn btn-primary" onclick="nav('submit')">Add your voice</button><button class="btn btn-secondary" onclick="nav('pillars')">View pillars</button></div>`;
}

function renderPillars(m){
  const items=PILLARS.map(p=>{const open=S.openPillars.has(p.id);
    return`<div class="pillar-ref"><div class="pillar-ref-header" onclick="togglePillarRef(${p.id})">
      <span class="num">${p.id}</span><span class="emoji-lg">${p.emoji}</span><span class="title">${p.name}</span><span class="arrow ${open?'open':''}">▶</span></div>
      <div class="pillar-ref-body ${open?'open':''}"><ul>${p.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
      ${p.principle?`<div class="principle">Connects to: ${p.principle}</div>`:''}</div></div>`;}).join('');
  m.innerHTML=`<h2>The 12 Pillars</h2><p class="subtitle">Every topic the constitution could address. Tap to expand. Pick 1–3 when you submit.</p>
  <div style="margin-bottom:16px"><button class="btn-secondary btn" style="font-size:12px;padding:6px 14px" onclick="toggleAllPillars()">${S.openPillars.size===PILLARS.length?'Collapse all':'Expand all'}</button></div>${items}`;
}

function renderSubmit(m){
  if(!db){m.innerHTML='<div class="empty-state">Database unavailable.</div>';return;}
  const chips=PILLARS.map(p=>`<button class="pillar-chip ${S.selectedPillars.has(p.id)?'selected':''}" onclick="togglePillar(${p.id})"><span class="emoji">${p.emoji}</span>${p.name}</button>`).join('');
  const fc=S.attachedFiles.map((f,i)=>`<div class="file-preview"><span>${f.type==='image'?'🖼️':'📄'}</span><span class="name">${esc(f.name)}</span><span style="color:var(--muted);font-size:11px">${f.type==='image'?'image':((f.text.length/1000).toFixed(0)+'k chars')}</span><button class="remove" onclick="removeFile(${i})">✕</button></div>`).join('');
  m.innerHTML=`<h2>Share your voice</h2><p class="subtitle">Write, paste, or drop a file. Pick pillars if you know them — or skip and AI auto-detects.</p>
  <div class="drop-zone" id="drop-zone"><input type="file" accept=".txt,.docx,.md,.rtf,.pdf,.png,.jpg,.jpeg,image/*,application/pdf" multiple onchange="handleFiles(this.files)"><span class="icon">📂</span><span class="label">Drop files here or <strong>browse</strong><br><span style="font-size:12px;color:var(--muted)">.txt, .docx, .pdf, .png, .jpg</span></span></div>${fc}
  <div class="or-divider">or write / paste below</div>
  <textarea id="voice-text" placeholder="What do you believe? What behaviors should the constitution enshrine? Paste from a doc, brain-dump, or write a sentence.">${esc(S.attachedText)}</textarea>
  <h3 style="margin-top:20px">Pillars <span style="font-weight:400;color:var(--muted);font-size:13px">(optional — AI auto-detects if you skip)</span></h3>
  <div class="pillar-grid">${chips}</div>
  <div class="form-row"><div class="toggle-row" onclick="toggleAnon()"><div class="toggle ${S.anonymous?'on':''}"></div><span>Anonymous</span></div>
  ${!S.anonymous?'<input type="text" id="display-name" placeholder="Name or handle">':''}</div>
  <div class="form-row"><div class="toggle-row" onclick="S.isTest=!S.isTest;render()"><div class="toggle toggle-sm ${S.isTest?'on':''}" style="${S.isTest?'background:var(--muted)':''}"></div><span>Test submission</span></div>
  ${S.isTest?'<span style="font-size:11px;color:var(--muted)">Excluded from synthesis by default</span>':''}</div>
  ${S.submitting?'<div class="loading"><div class="spinner"></div>Processing your voice...</div>'
  :`<button class="btn btn-primary" onclick="submitVoice()" ${S.canWrite!==false?'':'disabled'}>Submit</button>`}`;
}

function renderVoices(m){
  const allReal=S.submissions.filter(s=>!s.isTest),allTest=S.submissions.filter(s=>s.isTest);
  const subs=filteredSubs(),myCount=S.myId?allReal.filter(s=>s.uid===S.myId).length:0;
  if(!S.submissions.length){m.innerHTML=`<h2>Voices</h2>
    <div class="preview-block"><div class="preview-title">📊 Pillar coverage chart</div><p>A bar chart showing how many submissions touch each pillar — where the energy flows and which areas need more voices.</p></div>
    <div class="preview-block"><div class="preview-title">📝 Summaries</div><p>Each voice appears as a card with its tagged pillars and an AI-generated summary of the contributor's position — not the raw text. Your own submissions show the full text to you only.</p></div>
    <div style="text-align:center;margin-top:20px"><button class="btn btn-primary" onclick="nav('submit')">Add the first voice</button></div>`;return;}
  const counts={};PILLARS.forEach(p=>counts[p.id]=0);
  subs.forEach(s=>(s.pillars||[]).forEach(pid=>counts[pid]=(counts[pid]||0)+1));
  const mx=Math.max(1,...Object.values(counts));
  const bars=PILLARS.map(p=>`<div class="bar-row"><div class="bar-label">${p.emoji} ${p.name}</div><div class="bar-track"><div class="bar-fill" style="width:${((counts[p.id]||0)/mx*100).toFixed(0)}%"></div></div><div class="bar-count">${counts[p.id]||0}</div></div>`).join('');
  const cards=subs.map(s=>{
    const pills=(s.pillars||[]).map(pid=>{const p=PILLARS.find(x=>x.id===pid);return p?`<span class="pill ${s.autoTagged?'auto':''}">${p.emoji} ${p.name}</span>`:''}).join('');
    const who=s.displayName||'Anonymous',when=s.timestamp?new Date(s.timestamp).toLocaleDateString():'';
    const isMine=S.myId&&s.uid===S.myId;
    const displayText=s.summary||'Summary pending...';
    const rawId='raw-'+s.id;
    let rawBlock='';
    if(isMine){
      const rawPreview=(s.content||'').length>800?(s.content.slice(0,800)+'…'):s.content;
      rawBlock=`<button class="raw-toggle" onclick="document.getElementById('${rawId}').classList.toggle('show')">Show your full submission</button><div class="raw-content" id="${rawId}">${esc(rawPreview)}</div>`;
    }
    return`<div class="submission-card${isMine?' mine':''}${s.isTest?' test-card':''}">
      <div class="submission-meta">${esc(who)} · ${when}${s.autoTagged?' · <span style="color:var(--commons)">auto-tagged</span>':''}${isMine?' · <span class="mine-badge">yours</span>':''}${s.isTest?' · <span class="test-badge">test</span>':''}</div>
      <div class="submission-pills">${pills}</div>
      <div class="submission-text"><span class="summary-text">${esc(displayText)}</span></div>${rawBlock}</div>`;
  }).join('');
  m.innerHTML=`<h2>All Voices <span style="color:var(--accent)">(${allReal.length}${allTest.length?' + '+allTest.length+' test':''})</span></h2>
  <div class="filter-bar">
    <div class="toggle-row" onclick="S.showTests=!S.showTests;render()"><div class="toggle toggle-sm ${S.showTests?'on':''}" style="${S.showTests?'background:var(--muted)':''}"></div><span>Show tests</span></div>
    ${S.myId?`<div class="toggle-row" onclick="S.showMine=!S.showMine;render()"><div class="toggle toggle-sm ${S.showMine?'on':''}"></div><span>Mine only (${myCount})</span></div>`:''}
  </div><div class="card">${bars}</div><h3 style="margin-bottom:16px">Submissions (${subs.length})</h3>${cards}`;
}

function renderSynthesis(m){
  const real=S.synthIncludeTests?S.submissions:S.submissions.filter(s=>!s.isTest);
  if(!S.submissions.length){m.innerHTML=`<h2>Synthesis</h2><p class="subtitle">Once voices come in, AI sorts everything into three categories.</p>
    <div class="preview-block" style="border-color:var(--commons)"><div class="preview-title"><span class="section-tag tag-commons" style="margin:0">The Commons</span></div><p>Topics where voices broadly agree. Easy wins — ratify quickly. Each shows the pillar, consensus summary, and strength.</p></div>
    <div class="preview-block" style="border-color:var(--contested)"><div class="preview-title"><span class="section-tag tag-contested" style="margin:0">Contested Ground</span></div><p>Topics where voices diverge. Your discussion agenda — the real debates. Each shows competing positions and the core tension.</p></div>
    <div class="preview-block" style="border-color:var(--gaps)"><div class="preview-title"><span class="section-tag tag-gaps" style="margin:0">The Gaps</span></div><p>Pillars nobody addressed. Blind spots to assign or discuss.</p></div>
    <div style="text-align:center;margin-top:16px"><button class="btn btn-primary" onclick="nav('submit')">Add the first voice</button></div>`;return;}
  let sb='';
  if(S.synthesizing){
    sb=`<div class="card"><div class="loading"><div class="spinner"></div>Reading all voices and finding patterns...</div>${S.synthText?`<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;font-size:13px;white-space:pre-wrap;color:var(--muted);margin-top:12px">${esc(S.synthText)}</div>`:''}</div>`;
  }else if(S.synthesis){
    const syn=S.synthesis,ts=syn.timestamp?new Date(syn.timestamp).toLocaleString():'';
    sb=`<p style="font-size:12px;color:var(--muted);margin-bottom:16px">Last run: ${ts} · ${syn.count||'?'} voices · ${syn.includedTests?'tests included':'tests excluded'}</p>`;
    if(syn.commons?.length){sb+=`<div class="card"><span class="section-tag tag-commons">The Commons — Where we agree</span>`;syn.commons.forEach(c=>{sb+=`<div class="synthesis-item"><strong>${c.pillar}</strong> <span style="font-size:11px;color:var(--commons)">[${c.strength||''}]</span><br>${c.summary}</div>`;});sb+=`</div>`;}
    if(syn.contested?.length){sb+=`<div class="card"><span class="section-tag tag-contested">Contested Ground — Where we diverge</span>`;syn.contested.forEach(c=>{sb+=`<div class="synthesis-item"><strong>${c.pillar}</strong><br>${(c.positions||[]).map((p,i)=>`<span style="color:var(--contested)">Position ${i+1}:</span> ${p}`).join('<br>')}<div class="tension">${c.tension||''}</div></div>`;});sb+=`</div>`;}
    if(syn.gaps?.length){sb+=`<div class="card"><span class="section-tag tag-gaps">The Gaps — What's missing</span>`;syn.gaps.forEach(g=>{sb+=`<div class="synthesis-item"><strong>${g.pillar}</strong><br><span style="color:var(--gaps)">${g.note}</span></div>`;});sb+=`</div>`;}
  }else{sb=`<div class="preview-block"><span class="section-tag tag-commons" style="margin:0">The Commons</span><p style="margin-top:8px">Consensus positions appear here once synthesis runs.</p></div>
    <div class="preview-block"><span class="section-tag tag-contested" style="margin:0">Contested Ground</span><p style="margin-top:8px">Competing positions and tensions appear here.</p></div>
    <div class="preview-block"><span class="section-tag tag-gaps" style="margin:0">The Gaps</span><p style="margin-top:8px">Uncovered pillars appear here.</p></div>`;}
  const hasAny=S.submissions.length>0;
  const testCount=S.submissions.filter(s=>s.isTest).length;
  const showControls=S.isOwner&&sample&&!S.synthesizing&&hasAny;
  m.innerHTML=`<h2>Synthesis</h2><p class="subtitle">AI analysis of all voices.</p>${sb}
  ${showControls?`<div style="margin-top:20px;text-align:center">
    ${testCount?`<div class="form-row" style="justify-content:center;margin-bottom:12px">
      <div class="toggle-row" onclick="S.synthIncludeTests=!S.synthIncludeTests;render()"><div class="toggle toggle-sm ${S.synthIncludeTests?'on':''}" style="${S.synthIncludeTests?'background:var(--muted)':''}"></div><span>Include test submissions (${testCount})</span></div>
    </div>`:''}
    ${real.length>0
      ?`<button class="btn btn-primary" onclick="runSynthesis()">Run synthesis on ${real.length} voices</button>
         <p style="font-size:12px;color:var(--muted);margin-top:6px">${S.synthIncludeTests?'Including test submissions':'Test submissions excluded'}</p>`
      :`<p style="font-size:13px;color:var(--muted)">All ${testCount} submissions are tests. Toggle "Include test submissions" above to analyze them.</p>`}
  </div>`:''}
  ${!S.isOwner&&!S.synthesis?'<p style="font-size:13px;color:var(--muted);text-align:center;margin-top:16px">Only the project lead can trigger synthesis.</p>':''}`;
}

function setupDropZone(){const dz=document.getElementById('drop-zone');if(!dz)return;
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover')});
  dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');handleFiles(e.dataTransfer.files)});}
async function handleFiles(files){for(const file of files){try{
  const isImg=file.type.startsWith('image/')||/\.(png|jpe?g|gif|webp)$/i.test(file.name);
  const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  if(isImg){
    if(!S.imagesOk){showToast('Image analysis may not be available — text extraction will be attempted');} 
    else if(S.maxImgBytes&&file.size>S.maxImgBytes){showToast(file.name+' is too large (max '+(S.maxImgBytes/1024/1024).toFixed(0)+'MB). Try a smaller image.');}
    S.attachedFiles.push({name:file.name,text:'[Image: '+file.name+']',type:'image',blob:file});
  }else if(isPdf){
    let text='';
    try{const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
      for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();text+=tc.items.map(x=>x.str).join(' ')+'\n';}}catch(pe){console.error('PDF parse:',pe);}
    if(text.trim()){S.attachedFiles.push({name:file.name,text:text.trim(),type:'text'});}
    else{S.attachedFiles.push({name:file.name,text:'[PDF: '+file.name+' — will be analyzed as image]',type:'image',blob:file});}
  }else if(file.name.endsWith('.docx')){
    const buf=await file.arrayBuffer();const r=await mammoth.extractRawText({arrayBuffer:buf});
    if(r.value.trim())S.attachedFiles.push({name:file.name,text:r.value.trim(),type:'text'});
  }else{const text=await file.text();
    if(text.trim())S.attachedFiles.push({name:file.name,text:text.trim(),type:'text'});
  }}catch(e){console.error(e);alert('Could not read '+file.name+'. Try pasting instead.');}}render();}
function removeFile(i){S.attachedFiles.splice(i,1);render()}
function togglePillar(id){S.selectedPillars.has(id)?S.selectedPillars.delete(id):S.selectedPillars.add(id);render()}
function toggleAnon(){S.anonymous=!S.anonymous;render()}
function togglePillarRef(id){S.openPillars.has(id)?S.openPillars.delete(id):S.openPillars.add(id);render()}
function toggleAllPillars(){if(S.openPillars.size===PILLARS.length)S.openPillars.clear();else PILLARS.forEach(p=>S.openPillars.add(p.id));render();}

async function submitVoice(){
  const textEl=document.getElementById('voice-text');const typed=textEl?.value?.trim()||'';
  const textFiles=S.attachedFiles.filter(f=>f.type!=='image');
  const imageFiles=S.attachedFiles.filter(f=>f.type==='image');
  const fileTexts=textFiles.map(f=>`[From: ${f.name}]\n${f.text}`).join('\n\n');
  const imageLabels=imageFiles.map(f=>`[Attached image: ${f.name}]`).join('\n');
  const fullText=[typed,fileTexts,imageLabels].filter(Boolean).join('\n\n');
  if(!fullText)return alert('Please write something or attach a file.');
  S.submitting=true;render();
  let pillars=[...S.selectedPillars].sort(),autoTagged=false,summary='';
  // Auto-tag + summarize with one sample call when not a test
  if(sample){
    try{
      const pl=PILLARS.map(p=>`${p.id}. ${p.name}`).join('\n');
      const needTag=pillars.length===0;
      const hasImgs=imgBlobs.length>0;
      const imgNote=hasImgs?'\n\nImages are attached — analyze their text/content too.':'';
      const prompt=needTag
        ?`Given these 12 pillars:\n${pl}\n\nAnalyze this submission. Return ONLY JSON:\n{"pillars":[1,3,7],"summary":"1-2 sentence summary of the key position."}${imgNote}\n\nTEXT:\n${fullText.slice(0,8000)}`
        :`Summarize this submission in 1-2 sentences. Capture the key position or argument. No names. Return ONLY JSON:\n{"summary":"..."}${imgNote}\n\nTEXT:\n${fullText.slice(0,8000)}`;
      const sampleOpts={modelTier:'quick'};
      const imgBlobs=imageFiles.map(f=>f.blob).filter(Boolean);
      if(imgBlobs.length&&S.imagesOk)sampleOpts.images=imgBlobs;
      let r;
      try{r=await sample.json(prompt,sampleOpts);}catch(e1){
        if(e1.code==='images_unavailable'||e1.code==='image_rejected'){
          showToast('Image analysis unavailable — analyzing text only');
          try{r=await sample.json(prompt,{modelTier:'quick'});}catch(e2){console.error('Text-only fallback:',e2);}
        }else{console.error('AI processing:',e1);showToast('AI analysis: '+(e1.message||e1.code||'error'));}
      }
      if(r){
        if(needTag&&Array.isArray(r.pillars)){pillars=r.pillars.filter(n=>typeof n==='number'&&n>=1&&n<=12);autoTagged=true;}
        if(r.summary)summary=r.summary;
      }
    }catch(e){console.error('AI processing outer:',e);}
  }
  if(!summary)summary=fullText.slice(0,200)+(fullText.length>200?'…':'');
  try{const nameEl=document.getElementById('display-name');
    await db.collection('submissions').add({pillars,content:fullText,summary,autoTagged,isTest:S.isTest,
      uid:S.myId||'',displayName:S.anonymous?'':(nameEl?.value?.trim()||''),timestamp:Date.now()});
    S.selectedPillars=new Set();S.attachedFiles=[];S.attachedText='';S.submitting=false;
    const wasTest=S.isTest;S.isTest=false;
    showToast(wasTest?'Test submission saved':'Your voice has been added to the fire');nav('voices');
  }catch(e){S.submitting=false;render();alert('Error: '+(e.message||e.code));}}

async function runSynthesis(){
  if(!sample||S.synthesizing)return;
  const real=S.synthIncludeTests?S.submissions:S.submissions.filter(s=>!s.isTest);
  if(!real.length)return alert('No submissions to analyze.');
  S.synthesizing=true;S.synthText='';render();
  const pl=PILLARS.map(p=>`${p.id}. ${p.name}`).join('\n');
  const st=real.map((s,i)=>{const pn=(s.pillars||[]).map(pid=>PILLARS.find(x=>x.id===pid)?.name||pid).join(', ');
    return`[Voice ${i+1} — Pillars: ${pn}]\n${(s.content||'').slice(0,2000)}`;}).join('\n\n---\n\n');
  const prompt=`Analyze ${real.length} submissions for the Burning Man AI Constitution.\n\n12 PILLARS:\n${pl}\n\nSUBMISSIONS:\n${st}\n\nRespond with ONLY JSON:\n{"commons":[{"pillar":"Name","pillarId":1,"summary":"What voices agree on","strength":"strong|moderate|emerging"}],"contested":[{"pillar":"Name","pillarId":1,"positions":["Position A","Position B"],"tension":"Core tension"}],"gaps":[{"pillar":"Name","pillarId":1,"note":"Why this gap matters"}]}\n\nEvery pillar in exactly one category. Be specific. Quote submissions where possible.`;
  try{const result=await sample.json(prompt,{onText:({text})=>{S.synthText=text;render();}});
    try{await db.doc('meta/synthesis').set({...result,timestamp:Date.now(),count:real.length,includedTests:S.synthIncludeTests});}catch(e){}
    S.synthesizing=false;S.synthText='';render();
  }catch(e){S.synthesizing=false;S.synthText='';render();alert(e.code==='not_granted'?'Claude access not granted.':'Error: '+(e.message||e.code));}}

function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
init();
</script>
</body>
</html>
